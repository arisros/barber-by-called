# =============================================================================
# Deployment Template — Homelab K3d Cluster
# =============================================================================
# Usage: Copy to your project's k8s/ directory and replace placeholders:
#   barber-by-called       → e.g. arisjirat-site, wa-bot
#   __VERSION__        → e.g. latest, v1.0.0 (use git tag in CI)
#   barber.arisjirat.com         → e.g. arisjirat.com, bot.arisjirat.com
#   __CONTAINER_PORT__ → e.g. 3000, 8080, 4321
#
# Quick replace:
#   sed -i '' \
#     -e 's/barber-by-called/my-app/g' \
#     -e 's/__VERSION__/latest/g' \
#     -e 's/barber.arisjirat.com/my-app.arisjirat.com/g' \
#     -e 's/__CONTAINER_PORT__/3000/g' \
#     deployment.yaml
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: barber-by-called
  namespace: apps
  labels:
    cluster: homelab
    namespace: apps
    app: barber-by-called
    service: barber-by-called
    env: production
    version: latest
    site: barber.arisjirat.com
    team: arisjirat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barber-by-called
  template:
    metadata:
      labels:
        cluster: homelab
        namespace: apps
        app: barber-by-called
        service: barber-by-called
        env: production
        version: latest
        site: barber.arisjirat.com
        team: arisjirat
    spec:
      containers:
        - name: barber-by-called
          image: ghcr.io/arisros/barber-by-called:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: barber-by-called-secret
                optional: true
