# CI/CD — Docker Deploy
# Builds Docker image, pushes to registry, SSHes to server and pulls + restarts.
# Use this for VPS, homelab, or any server with Docker installed.
# Copy to: .github/workflows/deploy.yml
#
# Required GitHub Secrets:
#   DOCKER_USERNAME    — Docker Hub username (or registry username)
#   DOCKER_PASSWORD    — Docker Hub token (Settings → Security → Access Tokens)
#   SSH_HOST           — VPS IP or hostname
#   SSH_USER           — SSH username (e.g. ubuntu, deploy)
#   SSH_PRIVATE_KEY    — SSH private key (no passphrase)
#   DEPLOY_PATH        — Path on server (e.g. /opt/apps/myapp)
#
# Optional (for env injection):
#   APP_ENV_VARS       — Base64-encoded .env file contents

name: Deploy (Docker)

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/barber-by-called

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest image
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Optionally update .env
            # echo "${{ secrets.APP_ENV_VARS }}" | base64 -d > .env

            # Restart
            docker-compose pull
            docker-compose up -d --remove-orphans

            # Cleanup old images
            docker image prune -f

            echo "✅ Deployed $(date)"
